name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installieren
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      - name: Config & Schema konsistent
        run: python scripts/validate_config.py

      - name: Felder mit Schema in Sync
        run: python scripts/sync_fields.py --check

      - name: Newsletter-Template valide
        run: python scripts/validate_newsletter.py --template

      # out/ ist ein lokaler Staging-Ordner (gitignored) — in CI nie vorhanden.
      # Geprüft wird hier, dass die Werkzeuge selbst sauber validieren: die
      # mitgelieferten Beispiel-Dokumente. Die Validierung echter out/-Docs
      # passiert lokal beim Erzeugen (new_doc.py --validate).
      - name: Beispiel-Dokumente validieren
        run: |
          shopt -s nullglob
          docs=(tests/fixtures/valid/*.md)
          if [ ${#docs[@]} -gt 0 ]; then
            python scripts/validate.py "${docs[@]}"
          fi
