# Maschinenlesbares Frontmatter-Schema pro Dokumenttyp.
# validate.py prüft Dokumente hiergegen mit echtem JSON Schema (Draft 2020-12).
#
# Pro Typ steht unter `types.<typ>` ein vollständiges JSON Schema. Dadurch gibt es
# Typprüfung, Pattern, Datumsformat und additionalProperties (warnt vor Tippfehlern
# in Feldnamen) gratis — ohne eigenen Validierungscode.
#
# Hinweis: created wird als ISO-Datum (YYYY-MM-DD) geprüft. validate.py normalisiert
# YAML-Date-Objekte vorher zu Strings, damit "format": "date" greift.

types:
  session-log:
    type: object
    additionalProperties: false
    required: [title, type, created]
    properties:
      title:   { type: string, minLength: 1 }
      type:    { const: session-log }
      created: { type: string, format: date }

  agent-instructions:
    type: object
    additionalProperties: false
    required: [title, type, created]
    properties:
      title:   { type: string, minLength: 1 }
      type:    { const: agent-instructions }
      created: { type: string, format: date }

  spec:
    type: object
    additionalProperties: false
    required: [title, type, created, status]
    properties:
      title:   { type: string, minLength: 1 }
      type:    { const: spec }
      created: { type: string, format: date }
      status:  { enum: [draft, approved, implemented] }

  # newsletter: HTML-Output, kein YAML-Frontmatter — von dieser Frontmatter-
  # Validierung ausgenommen. Eigene Prüfung (Wohlgeformtheit, Pflicht-Kontext,
  # Mail-Client-Härtung) via scripts/validate_newsletter.py, siehe rules/newsletter.md.
